name: CI/CD Pipeline

on:
  push:
    branches:
      - main # workflow的名字，显示在Actions标签页中
jobs:
  build:
    runs-on: ubuntu-latest # 在哪个环境中运行，GitHub提供的免费ubuntu环境
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # 拉取代码到虚拟机中，每个workflow必须有这个步骤
      - name: Build Docker image
        run: |
          docker build -t expense-tracking:v1 .  # 构建Docker镜像,命名为expense-tracking:v1
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # 从GitHub Secrets中获取Docker Hub用户名
          password: ${{ secrets.DOCKER_PASSWORD }} # 从GitHub Secrets中获取Docker Hub密码
      - name: Push Docker image
        run: |
          docker tag expense-tracking:v1 luckyh/expense-tracking:${GITHUB_SHA} # 给镜像打标签, 使用GitHub的SHA作为版本号
          docker tag expense-tracking:v1 luckyh/expense-tracking:latest # 给镜像打标签latest
          docker push luckyh/expense-tracking:${GITHUB_SHA} # 推送镜像到Docker Hub
          docker push luckyh/expense-tracking:latest # 推送latest标签的镜像到Docker Hub
